<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="420" height="200" role="img" aria-label="Sports car, top view">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e46c0c"/>
      <stop offset="0.55" stop-color="#f58220"/>
      <stop offset="1" stop-color="#ff9a33"/>
    </linearGradient>
    <!-- Top half of the car (nose points right). The bottom half is a mirrored copy. -->
    <g id="half">
      <!-- body shell -->
      <path d="M8 100 C8 62 15 32 42 15 C60 8 90 9 120 10 L285 13 C335 15 372 32 393 60 C406 78 412 90 413 101.5 Z" fill="url(#body)"/>
      <!-- body shading along the flank -->
      <path d="M60 15 L285 17 C328 19 358 31 378 50 L330 38 L100 25 Z" fill="#c9600d" opacity="0.28"/>
      <!-- rear wing -->
      <path d="M8 100 C8 62 15 34 40 17 C47 15 52 19 49 30 C43 50 41 78 42 101.5 Z" fill="#1d1d1b"/>
      <!-- rear side intakes -->
      <path d="M58 42 L112 30 C119 30 119 35 112 38 L66 53 Z" fill="#3a3a38"/>
      <path d="M128 27 L172 22 L174 27 L133 34 Z" fill="#2c2c2a"/>
      <path d="M180 24 L240 19 L241 24 L184 30 Z" fill="#2c2c2a"/>
      <!-- roof / engine cover -->
      <path d="M92 101.5 C92 80 95 62 104 54 C140 42 215 34 262 30 L300 28 C322 28 334 44 337 70 C338 84 338 92 338 101.5 Z" fill="#4c4b4b"/>
      <!-- engine bay -->
      <path d="M98 101.5 L99 66 C100 58 106 56 112 55 L168 46 C172 48 174 70 174 101.5 Z" fill="#222221"/>
      <path d="M180 101.5 L181 58 C200 52 225 48 246 46 L246 101.5 Z" fill="#232322"/>
      <!-- windshield -->
      <path d="M250 101.5 L250 56 C250 44 262 36 280 34 C306 33 322 48 326 72 C328 84 328 92 328 101.5 Z" fill="#6b6a6a"/>
      <path d="M262 101.5 L262 60 C275 52 300 50 318 62 L318 101.5 Z" fill="#8a8989" opacity="0.5"/>
      <path d="M250 101.5 L250 56 C250 44 262 36 280 34 C306 33 322 48 326 72 C328 84 328 92 328 101.5" fill="none" stroke="#151515" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- wing mirror -->
      <path d="M232 14 L236 1 C241 0 247 2 250 7 L247 15 Z" fill="#1d1d1b"/>
      <!-- door cut line -->
      <path d="M252 14 L254 32" stroke="#c9600d" stroke-width="1.2" fill="none"/>
      <!-- headlight -->
      <path d="M350 40 C366 46 380 56 387 67 C380 67 365 59 350 49 Z" fill="#0e0e0e"/>
      <path d="M356 46 C366 50 374 57 379 62" stroke="#b9b9b9" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <!-- front fender vent -->
      <path d="M372 24 C386 36 398 52 402 66 L394 62 C388 50 380 38 368 27 Z" fill="#2b2b29"/>
      <!-- hood highlight -->
      <path d="M346 101.5 C346 88 349 76 357 68 C364 78 366 90 366 101.5 Z" fill="#ffb25a" opacity="0.35"/>
    </g>
  </defs>
  <use href="#half"/>
  <use href="#half" transform="translate(0 200) scale(1 -1)"/>
</svg>
